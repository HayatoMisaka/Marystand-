<style>
/* Layout: one narrow column for phones. Sticky bar holds the JA/EN switch and category tabs.
   Under each language the other language stays visible in small type, so guests can point at the Japanese name to order. */
:root {
  --font-display: "Bricolage Grotesque", "Noto Sans JP", system-ui, sans-serif;
  --font-body: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif;
  --bg: #FFF5E8;
  --surface: #FFFBF4;
  --surface2: #FCE7CF;
  --fg: #12302E;
  --muted: #566B68;
  --accent: #D74B12;
  --accent-text: #B63908;
  --on-accent: #FFFFFF;
  --mint: #BFE3DC;
  --mint-ink: #0F3B37;
  --line: #EBD3B6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1F1E; --surface: #14292A; --surface2: #1B3836; --fg: #FFF1DF; --muted: #9FB6B1;
    --accent: #FF8A50; --accent-text: #FF9B6B; --on-accent: #2A1206;
    --mint: #2B5853; --mint-ink: #D5F1EC; --line: #2A4744;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1F1E; --surface: #14292A; --surface2: #1B3836; --fg: #FFF1DF; --muted: #9FB6B1;
  --accent: #FF8A50; --accent-text: #FF9B6B; --on-accent: #2A1206;
  --mint: #2B5853; --mint-ink: #D5F1EC; --line: #2A4744;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 720px; margin-inline: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px 10px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.wm { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: .02em; }
.loc { font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.lang { display: flex; border: 1.5px solid var(--fg); border-radius: 999px; overflow: hidden; flex: none; }
.lang button { background: transparent; border: 0; padding: 6px 14px; font-weight: 700; font-size: .85rem; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.tabs { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .86rem; white-space: nowrap; }
.tabs button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* intro */
.intro { padding-block: 22px 8px; }
.intro h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 12vw, 3.6rem); line-height: .95; letter-spacing: -.01em; margin: 0 0 8px; text-wrap: balance; }
.tagline { margin: 0 0 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.chips li { background: var(--mint); color: var(--mint-ink); border-radius: 999px; padding: 4px 12px; font-size: .8rem; font-weight: 700; }
.search { margin-top: 16px; }
.search input { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.search input::placeholder { color: var(--muted); }

/* categories */
.cat { padding-top: 36px; scroll-margin-top: calc(120px + env(safe-area-inset-top, 0px)); }
.ch { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); }
.ch h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 9vw, 2.6rem); line-height: 1; margin: 0; text-wrap: balance; }
.cnote { color: var(--muted); font-size: .88rem; margin: 8px 0 0; max-width: 60ch; }

.grp { margin-top: 26px; }
.gh h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; margin: 0; padding-bottom: 6px; position: relative; text-wrap: balance; }
.gh h3::after { content: ""; position: absolute; left: 0; bottom: 0; width: 48px; height: 3px; background: var(--accent); }
.gnote { margin: 8px 0 0; font-size: .84rem; color: var(--muted); }

.items { list-style: none; margin: 6px 0 0; padding: 0; }
.it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.nm { font-weight: 700; font-size: 1.02rem; line-height: 1.35; overflow-wrap: anywhere; }
.sub { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); margin-top: 1px; }
.dsc { grid-column: 1; margin: 0; font-size: .87rem; color: var(--muted); }
.badge { display: inline-block; background: var(--accent); color: var(--on-accent); font-size: .68rem; font-weight: 700; border-radius: 4px; padding: 1px 7px; margin-left: 8px; vertical-align: 2px; letter-spacing: .02em; }
.pr { grid-column: 2; grid-row: 1 / span 3; text-align: right; display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.pl { font-variant-numeric: tabular-nums; white-space: nowrap; font-family: var(--font-display); }
.pl b { font-weight: 700; font-size: 1.02rem; }
.pl em { font-style: normal; font-family: var(--font-body); font-size: .68rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }

/* sets */
.seg { display: inline-flex; border: 1.5px solid var(--fg); border-radius: 999px; overflow: hidden; margin-top: 14px; }
.seg button { background: transparent; border: 0; padding: 7px 18px; font-weight: 700; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.sets { display: grid; gap: 14px; margin-top: 16px; }
.set { background: var(--surface2); border-radius: 14px; padding: 16px; }
.set-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.set-h h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin: 0; }
.set-p { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; color: var(--accent-text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.set p { margin: 6px 0 12px; font-size: .9rem; }
.set ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.set li { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: .8rem; }

.none { padding-block: 40px; color: var(--muted); text-align: center; }

footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); font-size: .86rem; color: var(--muted); }
footer p { margin: 0 0 8px; }
footer a { color: var(--accent-text); font-weight: 700; }
</style>
</head>

const UI = {
  tagline: ["裏路地のハンバーガーレストラン", "A hamburger restaurant on a back street in Shimokitazawa"],
  chips: [["下北沢駅西口から徒歩30秒", "30 sec from Shimokitazawa Stn. West Exit"], ["ペットOK", "Pets welcome"], ["2020年OPEN", "Open since 2020"]],
  ph: ["メニューを検索(例: アボカド)", "Search the menu (e.g. avocado)"],
  loc: ["下北沢", "Shimokitazawa"],
  none: ["見つかりませんでした。別の言葉でお試しください。", "Nothing found. Try another word."],
  lunch: ["ランチ", "Lunch"], dinner: ["ディナー", "Dinner"],
  setnote: ["ランチとディナーでセットの内容が異なります。", "Sets differ between lunch and dinner."],
  addr: ["東京都世田谷区北沢2丁目23-11 ・ 井の頭線 下北沢駅西口から徒歩30秒", "2-23-11 Kitazawa, Setagaya, Tokyo ・ 30 sec walk from Shimokitazawa Station (Inokashira Line), West Exit"]
};

/* ---------- state ---------- */
let lang = "ja", mode = "lunch", query = "";
try { const s = localStorage.getItem("ms-lang"); if (s === "ja" || s === "en") lang = s; else if (!(navigator.language || "").toLowerCase().startsWith("ja")) lang = "en"; } catch (e) {}
const T = a => a[lang === "ja" ? 0 : 1];
const O = a => a[lang === "ja" ? 1 : 0];
const yen = v => typeof v === "number" ? "¥" + v.toLocaleString("en-US") : v;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---------- render ---------- */
function itemHTML(it) {
  const name = lang === "ja" ? it.ja : it.en, other = lang === "ja" ? it.en : it.ja;
  const desc = lang === "ja" ? it.jd : it.ed;
  const badge = it.b ? `<span class="badge">${esc(T(it.b))}</span>` : "";
  const prices = it.p.map(([l, v]) => `<span class="pl">${l ? `<em>${esc(T(l))}</em>` : ""}<b>${yen(v)}</b></span>`).join("");
  return `<li class="it"><div class="nm">${esc(name)}${badge}<span class="sub">${esc(other)}</span></div>${desc ? `<p class="dsc">${esc(desc)}</p>` : ""}<div class="pr">${prices}</div></li>`;
}
const match = it => !query || [it.ja, it.en, it.jd || "", it.ed || ""].join(" ").toLowerCase().includes(query);

function setsHTML(c) {
  const cards = SETS[mode].map(s => `<article class="set"><div class="set-h"><h3>${esc(T(s.t))}</h3><span class="set-p">${esc(s.p)}</span></div><p>${esc(T(s.d))}</p><ul>${s.c.map(x => `<li>${esc(T(x))}</li>`).join("")}</ul></article>`).join("");
  return `<section class="cat" id="${c.id}"><header class="ch"><span class="eyebrow">${esc(O(c.n))}</span><h2>${esc(T(c.n))}</h2><p class="cnote">${esc(T(UI.setnote))}</p></header>
    <div class="seg" role="group"><button type="button" data-mode="lunch" aria-pressed="${mode === "lunch"}">${esc(T(UI.lunch))}</button><button type="button" data-mode="dinner" aria-pressed="${mode === "dinner"}">${esc(T(UI.dinner))}</button></div>
    <div class="sets">${cards}</div></section>`;
}

function render() {
  let html = "", found = false;
  for (const c of CATS) {
    if (c.special) { if (!query) { html += setsHTML(c); found = true; } continue; }
    let inner = "";
    for (const g of c.groups) {
      const items = g.items.filter(match);
      if (!items.length) continue;
      inner += `<section class="grp"><div class="gh"><h3>${esc(T(g.n))}</h3>${g.note ? `<p class="gnote">${esc(T(g.note))}</p>` : ""}</div><ul class="items">${items.map(itemHTML).join("")}</ul></section>`;
    }
    if (inner) {
      found = true;
      html += `<section class="cat" id="${c.id}"><header class="ch"><span class="eyebrow">${esc(O(c.n))}</span><h2>${esc(T(c.n))}</h2>${c.note && !query ? `<p class="cnote">${esc(T(c.note))}</p>` : ""}</header>${inner}</section>`;
    }
  }
  document.getElementById("menu").innerHTML = found ? html : `<p class="none">${esc(T(UI.none))}</p>`;
  spy();
}

function renderChrome() {
  document.documentElement.lang = lang;
  document.getElementById("b-ja").setAttribute("aria-pressed", lang === "ja");
  document.getElementById("b-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("loc").textContent = T(UI.loc);
  document.getElementById("tagline").textContent = T(UI.tagline);
  document.getElementById("chips").innerHTML = UI.chips.map(x => `<li>${esc(T(x))}</li>`).join("");
  document.getElementById("q").placeholder = T(UI.ph);
  document.getElementById("q").setAttribute("aria-label", T(UI.ph));
  document.getElementById("addr").textContent = T(UI.addr);
  document.getElementById("tabs").innerHTML = CATS.map(c => `<button type="button" data-go="${c.id}">${esc(T(c.n))}</button>`).join("");
  spy();
}

/* ---------- interaction ---------- */
function spy() {
  const secs = [...document.querySelectorAll(".cat")];
  const line = (document.querySelector(".top")?.offsetHeight || 100) + 40;
  let cur = secs.length ? secs[0].id : "";
  for (const s of secs) if (s.getBoundingClientRect().top <= line) cur = s.id;
  document.querySelectorAll("#tabs button").forEach(b => {
    const on = b.dataset.go === cur;
    if (on) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    if (on && b.dataset.seen !== cur) { b.dataset.seen = cur; b.scrollIntoView({ block: "nearest", inline: "center" }); }
  });
}
let tick = false;
addEventListener("scroll", () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; spy(); }); } }, { passive: true });

document.addEventListener("click", e => {
  const l = e.target.closest("[data-lang]");
  if (l) { lang = l.dataset.lang; try { localStorage.setItem("ms-lang", lang); } catch (x) {} renderChrome(); render(); return; }
  const m = e.target.closest("[data-mode]");
  if (m) { mode = m.dataset.mode; render(); return; }
  const g = e.target.closest("[data-go]");
  if (g) { const el = document.getElementById(g.dataset.go); if (el) el.scrollIntoView({ block: "start" }); }
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

renderChrome();
render();
</script>
